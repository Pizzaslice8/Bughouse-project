                pieces[start].innerHTML = "";

            function getPiece(square) {
                return (square < 64) ? position1[square] : position2[square-64];

            function getX(square) {
                return (square % 64) % 8;
            }
            function getY(square) {
                return (square % 64 - getX(square)) / 8;
            }
